name: Release

on:
  push:
    tags:
      - "stratosphere-*-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release (wallet, core, shared)"
        required: true
        type: choice
        options:
          - wallet
          - core
          - shared
      version:
        description: "Version to release"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Extract package info from tag
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use inputs
            PACKAGE_NAME="${{ github.event.inputs.package }}"
            VERSION="${{ github.event.inputs.version }}"
            PACKAGE_FULL="@stratosphere/$PACKAGE_NAME"
          else
            # Tag trigger - extract from tag name
            TAG="${{ github.ref_name }}"
            # Extract package name and version from tag like stratosphere-wallet-v1.0.1
            PACKAGE_NAME=$(echo $TAG | sed 's/stratosphere-\(.*\)-v.*/\1/')
            VERSION=$(echo $TAG | sed 's/.*-v\(.*\)/\1/')
            PACKAGE_FULL="@stratosphere/$PACKAGE_NAME"
          fi
          echo "package_full=$PACKAGE_FULL" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ./sdk
        run: npm ci

      - name: Build all packages
        working-directory: ./sdk
        run: npm run build

      - name: Publish package
        working-directory: ./sdk
        run: npm publish -w ${{ steps.extract.outputs.package_full }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ steps.extract.outputs.package_full }} v${{ steps.extract.outputs.version }}
          body: |
            ## Released Package
            - **Package**: ${{ steps.extract.outputs.package_full }}
            - **Version**: ${{ steps.extract.outputs.version }}

            ## Installation
            ```bash
            npm install ${{ steps.extract.outputs.package_full }}@${{ steps.extract.outputs.version }}
            ```

            See commit history for detailed changes.
          draft: false
          prerelease: false
